[project]
name = "wpylog"
version = "0.2.0"
description = "Lightweight Python logging library with color console and JSON file output"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "seoyc", email = "wkqco33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []
keywords = ["logging", "json", "structured-logging", "color", "python-logging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/wkqco33/wlogger"
Repository = "https://github.com/wkqco33/wlogger"
Issues = "https://github.com/wkqco33/wlogger/issues"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wlogger"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
